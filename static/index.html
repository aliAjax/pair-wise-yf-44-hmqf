<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>临时变更协调台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f8fafc; color: #1f2937; }
    main { max-width: 1080px; margin: auto; padding: 1.5rem; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.05rem; margin-top: 2rem; border-left: 4px solid #2563eb; padding-left: .5rem; }
    section { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem 1.2rem; margin-top: 1rem; }
    label { display: block; font-size: .85rem; color: #4b5563; margin-top: .6rem; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: .45rem .6rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: .9rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .8rem; }
    button { padding: .45rem .9rem; cursor: pointer; border: 1px solid #2563eb; background: #2563eb; color: #fff; border-radius: 6px; font-size: .85rem; }
    button.ghost { background: #fff; color: #2563eb; }
    button.warn { border-color: #d97706; background: #d97706; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: .8rem; }
    th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
    th { color: #6b7280; font-weight: 600; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .75rem; background: #e5e7eb; }
    .st-draft { background: #e5e7eb; }
    .st-submitted { background: #dbeafe; color: #1d4ed8; }
    .st-active { background: #dcfce7; color: #15803d; }
    .st-restored { background: #f3f4f6; color: #6b7280; }
    .expired { background: #fee2e2; color: #b91c1c; margin-left: .3rem; }
    .blocker { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: .5rem .8rem; margin-top: .5rem; font-size: .85rem; color: #991b1b; }
    .ok { color: #15803d; font-size: .85rem; }
    #result { background: #111827; color: #d1fae5; padding: .8rem 1rem; border-radius: 8px; white-space: pre-wrap; word-break: break-all; font-size: .82rem; min-height: 2.5rem; }
    #result.error { color: #fecaca; }
    .row-actions button { margin: .1rem .2rem .1rem 0; }
    .unit-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: .8rem 1rem; margin-top: .8rem; }
    .muted { color: #6b7280; font-size: .8rem; }
  </style>
</head>
<body>
<main>
  <h1>临时变更协调台</h1>
  <p class="muted">夜间抢修临时变更：登记 → 提交 → 安全员确认生效 → 到期恢复。到期未恢复的装置禁止启动；已到期单据不能续期，须重新登记评估。</p>

  <section>
    <div class="grid">
      <div><label>操作人</label><input id="userId" value="op-1"></div>
      <div><label>角色</label>
        <select id="role">
          <option value="operator">operator 值班员</option>
          <option value="engineer">engineer 工程师</option>
          <option value="safety">safety 安全员</option>
          <option value="admin">admin 管理员</option>
          <option value="viewer">viewer 只读</option>
        </select>
      </div>
      <div style="align-self:end"><button class="ghost" onclick="refreshAll()">刷新全部</button></div>
    </div>
  </section>

  <h2>登记临时变更</h2>
  <section>
    <div class="grid">
      <div><label>受影响装置</label><select id="tcUnit"></select></div>
      <div><label>恢复负责人</label><input id="tcRestoreOwner" placeholder="如：张工"></div>
      <div><label>作业开始</label><input id="tcStart" type="datetime-local"></div>
      <div><label>作业结束</label><input id="tcEnd" type="datetime-local"></div>
    </div>
    <label>作业内容</label><input id="tcDesc" placeholder="如：临时旁路液位联锁，更换变送器">
    <label>隔离措施</label><textarea id="tcIsolation" rows="2" placeholder="如：切断进料阀 XV-101，挂牌上锁，泄压至常压"></textarea>
    <p><button onclick="registerTempChange()">登记并提交</button></p>
  </section>

  <h2>临时变更单</h2>
  <section>
    <table>
      <thead><tr><th>单号</th><th>装置</th><th>作业时段</th><th>隔离措施</th><th>恢复负责人</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="tcRows"><tr><td colspan="7" class="muted">暂无数据</td></tr></tbody>
    </table>
  </section>

  <h2>续期（重新评估风险）</h2>
  <section>
    <p class="muted">续期会生成新的确认版本（revision +1），需安全员再次确认后才生效；已到期的单据不能续期，请重新登记。</p>
    <div class="grid">
      <div><label>续期单据</label><select id="rnId"></select></div>
      <div><label>新开始时间</label><input id="rnStart" type="datetime-local"></div>
      <div><label>新结束时间</label><input id="rnEnd" type="datetime-local"></div>
      <div><label>风险等级</label>
        <select id="rnRisk"><option value="low">low</option><option value="medium" selected>medium</option><option value="high">high</option><option value="critical">critical</option></select>
      </div>
      <div><label>评估人</label><input id="rnAnalyst" placeholder="如：E-7"></div>
    </div>
    <p><button class="warn" onclick="renewTempChange()">提交续期评估</button></p>
  </section>

  <h2>装置状态与阻塞项</h2>
  <section id="unitList"><p class="muted">暂无装置</p></section>

  <h2>结果</h2>
  <pre id="result">等待操作</pre>
</main>
<script>
const STATUS_ZH = { draft: '草稿', submitted: '待安全确认', active: '生效中', restored: '已恢复' };
let units = [];
let tempChanges = [];

function headers() {
  return {
    'Content-Type': 'application/json',
    'X-User-Id': document.getElementById('userId').value || 'anonymous',
    'X-Role': document.getElementById('role').value,
  };
}

function show(payload, isError) {
  const box = document.getElementById('result');
  box.className = isError ? 'error' : '';
  box.textContent = typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2);
}

async function api(path, options = {}) {
  const response = await fetch(path, { ...options, headers: { ...headers(), ...(options.headers || {}) } });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    const err = new Error(body.error || ('HTTP ' + response.status));
    err.type = body.type;
    throw err;
  }
  return body;
}

async function run(fn) {
  try { await fn(); } catch (exc) { show((exc.type ? exc.type + ': ' : '') + exc.message, true); }
  await refreshAll();
}

function toIso(localValue) {
  return localValue ? new Date(localValue).toISOString() : '';
}

function shortId(id) { return id.slice(0, 8); }
function unitName(id) {
  const unit = units.find(u => u.id === id);
  return unit ? unit.data.name : shortId(id);
}
function isExpired(tc) {
  return tc.status === 'active' && new Date(tc.data.window_end).getTime() < Date.now();
}

async function refreshAll() {
  units = (await api('/api/units')).items;
  tempChanges = (await api('/api/temp_changes')).items;
  renderUnitOptions();
  renderTempChanges();
  renderRenewOptions();
  await renderUnits();
}

function renderUnitOptions() {
  document.getElementById('tcUnit').innerHTML =
    units.map(u => `<option value="${u.id}">${u.data.name}（${u.data.location || ''}）</option>`).join('');
}

function renderTempChanges() {
  const rows = document.getElementById('tcRows');
  if (!tempChanges.length) {
    rows.innerHTML = '<tr><td colspan="7" class="muted">暂无数据</td></tr>';
    return;
  }
  rows.innerHTML = tempChanges.map(tc => {
    const d = tc.data;
    const expired = isExpired(tc) ? '<span class="badge expired">已到期</span>' : '';
    const rev = d.revision ? ` v${d.revision}` : '';
    const actions = [];
    if (tc.status === 'draft') actions.push(`<button onclick="doAction('${tc.id}','submit')">提交</button>`);
    if (tc.status === 'submitted') actions.push(`<button onclick="confirmTempChange('${tc.id}')">安全员确认</button>`);
    if (tc.status === 'active') {
      actions.push(`<button class="warn" onclick="restoreTempChange('${tc.id}')">恢复</button>`);
      actions.push(`<button class="ghost" onclick="pickRenew('${tc.id}')">续期</button>`);
    }
    return `<tr>
      <td title="${tc.id}">${shortId(tc.id)}${rev}</td>
      <td>${unitName(d.unit_id)}</td>
      <td>${new Date(d.window_start).toLocaleString()}<br>至 ${new Date(d.window_end).toLocaleString()}</td>
      <td>${d.isolation || ''}</td>
      <td>${d.restore_owner || ''}</td>
      <td><span class="badge st-${tc.status}">${STATUS_ZH[tc.status] || tc.status}</span>${expired}</td>
      <td class="row-actions">${actions.join('')}</td>
    </tr>`;
  }).join('');
}

function renderRenewOptions() {
  const active = tempChanges.filter(tc => tc.status === 'active');
  document.getElementById('rnId').innerHTML = active.length
    ? active.map(tc => `<option value="${tc.id}">${shortId(tc.id)} - ${unitName(tc.data.unit_id)}（${tc.data.description || ''}）</option>`).join('')
    : '<option value="">（无生效中的单据）</option>';
}

async function renderUnits() {
  const box = document.getElementById('unitList');
  if (!units.length) { box.innerHTML = '<p class="muted">暂无装置</p>'; return; }
  const cards = await Promise.all(units.map(async u => {
    const info = await api(`/api/units/${u.id}/blockers`);
    const blockers = info.blockers.map(b =>
      `<div class="blocker">阻塞单 ${shortId(b.id)}：「${b.data.description || ''}」应于 ${new Date(b.data.window_end).toLocaleString()} 前恢复（恢复负责人：${b.data.restore_owner || '未登记'}），装置不能启动。</div>`
    ).join('');
    const state = info.can_startup
      ? '<span class="ok">可以启动</span>'
      : '<span class="badge expired">启动被阻塞</span>';
    return `<div class="unit-card">
      <strong>${u.data.name}</strong> <span class="muted">${u.data.location || ''} · 状态 ${u.status}</span> ${state}
      <div style="margin-top:.5rem">
        <button onclick="startupUnit('${u.id}')" ${info.can_startup ? '' : 'disabled'}>启动</button>
        <button class="ghost" onclick="shutdownUnit('${u.id}')">停运</button>
      </div>
      ${blockers}
    </div>`;
  }));
  box.innerHTML = cards.join('');
}

async function registerTempChange() {
  await run(async () => {
    const created = await api('/api/temp_changes', {
      method: 'POST',
      body: JSON.stringify({
        unit_id: document.getElementById('tcUnit').value,
        description: document.getElementById('tcDesc').value,
        window_start: toIso(document.getElementById('tcStart').value),
        window_end: toIso(document.getElementById('tcEnd').value),
        isolation: document.getElementById('tcIsolation').value,
        restore_owner: document.getElementById('tcRestoreOwner').value,
      }),
    });
    const submitted = await api(`/api/entities/${created.id}/actions`, {
      method: 'POST', body: JSON.stringify({ action: 'submit', data: {} }),
    });
    show({ created: created.id, status: submitted.status });
  });
}

async function doAction(id, action, data = {}) {
  await run(async () => {
    const updated = await api(`/api/entities/${id}/actions`, {
      method: 'POST', body: JSON.stringify({ action, data }),
    });
    show({ id: updated.id, status: updated.status, version: updated.version });
  });
}

async function confirmTempChange(id) {
  await doAction(id, 'confirm', {});
}

async function restoreTempChange(id) {
  await doAction(id, 'restore', { restored_by: document.getElementById('userId').value });
}

function pickRenew(id) {
  document.getElementById('rnId').value = id;
  document.getElementById('rnStart').focus();
  show('已选择续期单据 ' + shortId(id) + '，请填写新时段与风险评估');
}

async function renewTempChange() {
  const id = document.getElementById('rnId').value;
  if (!id) { show('没有可续期的生效单据', true); return; }
  await doAction(id, 'renew', {
    window_start: toIso(document.getElementById('rnStart').value),
    window_end: toIso(document.getElementById('rnEnd').value),
    risk_level: document.getElementById('rnRisk').value,
    analyst: document.getElementById('rnAnalyst').value,
  });
}

async function startupUnit(id) {
  await doAction(id, 'startup', {});
}

async function shutdownUnit(id) {
  const reason = prompt('停运原因', '临时停运');
  if (reason === null) return;
  await doAction(id, 'shutdown', { reason });
}

refreshAll().catch(exc => show(exc.message, true));
</script>
</body>
</html>
