<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>临时变更协调台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 960px; margin: auto; }
    section.card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1.2rem; }
    label { display: inline-block; margin: .3rem .8rem .3rem 0; font-size: .9rem; }
    input, select { padding: .35rem .5rem; border: 1px solid #d1d5db; border-radius: 6px; }
    button { padding: .45rem .8rem; cursor: pointer; border: 1px solid #9ca3af; border-radius: 6px; background: #fff; }
    button:hover { background: #f3f4f6; }
    #message { padding: .6rem .9rem; border-radius: 6px; margin-bottom: 1rem; display: none; white-space: pre-wrap; }
    #message.error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    #message.ok { display: block; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .item { border-top: 1px solid #e5e7eb; padding: .7rem 0; }
    .badge { display: inline-block; padding: .1rem .55rem; border-radius: 999px; font-size: .8rem; margin-right: .4rem; }
    .st-pending { background: #fef3c7; color: #92400e; }
    .st-active { background: #dbeafe; color: #1d4ed8; }
    .st-restored { background: #d1fae5; color: #065f46; }
    .st-rejected { background: #fee2e2; color: #991b1b; }
    .blocker { color: #b91c1c; font-size: .88rem; margin: .3rem 0 0; }
    .meta { color: #6b7280; font-size: .85rem; }
    .actions { margin-top: .5rem; }
    .actions label { font-size: .85rem; }
    .hint { color: #6b7280; }
  </style>
</head>
<body>
<main>
  <h1>临时变更协调台</h1>
  <p class="hint">夜间抢修临时变更流程：登记 → 安全员确认后占用 → 恢复；到期未恢复将阻塞装置启动，续期须重新评估风险并再次确认。</p>

  <section class="card">
    <label>用户 <input id="userId" value="on-duty-1"></label>
    <label>角色
      <select id="role">
        <option value="operator">operator 值班员</option>
        <option value="engineer">engineer 工程师</option>
        <option value="safety">safety 安全员</option>
        <option value="admin">admin 管理员</option>
        <option value="viewer">viewer 访客</option>
      </select>
    </label>
    <button onclick="loadBoard()">刷新</button>
  </section>

  <div id="message"></div>

  <section class="card">
    <h2>登记临时变更</h2>
    <form onsubmit="return submitChange(event)">
      <label>装置 <select id="f-unit" required></select></label>
      <label>作业内容 <input id="f-desc" required size="24" placeholder="如：临时旁路液位联锁"></label>
      <label>隔离措施 <input id="f-isolation" required size="24" placeholder="如：切断进料阀 XV-101 并挂牌"></label>
      <label>恢复负责人 <input id="f-owner" required size="10"></label>
      <label>作业开始 <input id="f-start" type="datetime-local" required></label>
      <label>作业结束 <input id="f-end" type="datetime-local" required></label>
      <button type="submit">提交登记</button>
    </form>
  </section>

  <section class="card">
    <h2>装置状态</h2>
    <div id="units">加载中…</div>
  </section>

  <section class="card">
    <h2>临时变更单</h2>
    <div id="changes">加载中…</div>
  </section>
</main>
<script>
const STATUS_LABEL = { pending: '待确认', active: '占用中', restored: '已恢复', rejected: '已退回' };
let board = { units: [], temp_changes: [] };

function headers() {
  return {
    'Content-Type': 'application/json',
    'X-User-Id': document.getElementById('userId').value || 'anonymous',
    'X-Role': document.getElementById('role').value,
  };
}

function showMessage(text, isError) {
  const box = document.getElementById('message');
  box.textContent = text;
  box.className = isError ? 'error' : 'ok';
}

function toIso(value) {
  return new Date(value).toISOString();
}

function fmt(value) {
  return value ? new Date(value).toLocaleString() : '-';
}

async function call(fn, okText) {
  try {
    await fn();
    showMessage(okText, false);
    await loadBoard();
  } catch (err) {
    showMessage(err.message, true);
  }
}

async function request(path, options) {
  const response = await fetch(path, options);
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw new Error(payload.error || ('请求失败：' + response.status));
  }
  return payload;
}

async function loadBoard() {
  board = await request('/api/board');
  renderUnitOptions();
  renderUnits();
  renderChanges();
}

function renderUnitOptions() {
  const select = document.getElementById('f-unit');
  const current = select.value;
  select.innerHTML = board.units.map(u =>
    `<option value="${u.id}">${escapeHtml(u.data.name || u.id)}（${u.status}）</option>`).join('');
  if (current) select.value = current;
}

function renderUnits() {
  const box = document.getElementById('units');
  if (!board.units.length) { box.textContent = '暂无装置'; return; }
  box.innerHTML = board.units.map(u => {
    const blockers = (u.startup_blockers || []).map(id =>
      `<p class="blocker">⛔ 禁止启动：临时变更单 ${shortId(id)} 到期未恢复</p>`).join('');
    const active = (u.active_temp_changes || []).length
      ? `<span class="meta">占用中作业：${u.active_temp_changes.map(shortId).join('、')}</span>` : '';
    return `<div class="item"><strong>${escapeHtml(u.data.name || u.id)}</strong>
      <span class="meta">状态 ${u.status}</span> ${active}${blockers}</div>`;
  }).join('');
}

function renderChanges() {
  const box = document.getElementById('changes');
  if (!board.temp_changes.length) { box.textContent = '暂无临时变更单'; return; }
  box.innerHTML = board.temp_changes.map(c => {
    const d = c.data;
    const parts = [
      `<span class="badge st-${c.status}">${STATUS_LABEL[c.status] || c.status}</span>`,
      `<strong>${escapeHtml(d.description || '')}</strong>`,
      `<span class="meta">单号 ${shortId(c.id)} · 确认版本 v${d.revision || 1}</span>`,
      `<br><span class="meta">装置 ${unitName(d.unit_id)} · 时段 ${fmt(d.work_start)} ~ ${fmt(d.work_end)}</span>`,
      `<br><span class="meta">隔离措施：${escapeHtml(d.isolation || '-')} · 恢复负责人：${escapeHtml(d.restore_owner || '-')}</span>`,
    ];
    if (d.risk_level) {
      parts.push(`<br><span class="meta">风险复评：${escapeHtml(d.risk_level)} — ${escapeHtml(d.risk_note || '')}</span>`);
    }
    if (c.status === 'pending' && c.conflicts && c.conflicts.length) {
      parts.push(`<p class="blocker">⚠ 时段冲突：与已生效单 ${c.conflicts.map(shortId).join('、')} 相撞，确认将被退回</p>`);
    }
    if (c.status === 'active' && c.overdue) {
      parts.push('<p class="blocker">⛔ 已到期未恢复：装置禁止启动；续期须重新评估风险并再次确认</p>');
    }
    parts.push(`<div class="actions">${actionButtons(c)}</div>`);
    return `<div class="item">${parts.join('')}</div>`;
  }).join('');
}

function actionButtons(c) {
  const id = c.id, v = c.version;
  if (c.status === 'pending') {
    return `<button onclick="confirmChange('${id}', ${v})">安全员确认</button>
      <button onclick="rejectChange('${id}', ${v})">退回</button>`;
  }
  if (c.status === 'active') {
    return `<label>恢复人 <input id="rb-${id}" size="8" value="${escapeHtml(c.data.restore_owner || '')}"></label>
      <label>恢复说明 <input id="rn-${id}" size="16" placeholder="隔离已解除，联锁复位"></label>
      <button onclick="restoreChange('${id}', ${v})">恢复</button>
      <span class="meta">|</span>
      <label>新结束时间 <input id="ne-${id}" type="datetime-local"></label>
      <label>风险等级 <select id="rl-${id}">
        <option value="low">low</option><option value="medium">medium</option>
        <option value="high">high</option><option value="critical">critical</option>
      </select></label>
      <label>复评说明 <input id="rk-${id}" size="14" placeholder="重新评估结论"></label>
      <button onclick="renewChange('${id}', ${v})">续期评估</button>`;
  }
  return '';
}

async function submitChange(event) {
  event.preventDefault();
  await call(async () => {
    await request('/api/temp_changes', {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({
        unit_id: document.getElementById('f-unit').value,
        description: document.getElementById('f-desc').value,
        isolation: document.getElementById('f-isolation').value,
        restore_owner: document.getElementById('f-owner').value,
        work_start: toIso(document.getElementById('f-start').value),
        work_end: toIso(document.getElementById('f-end').value),
      }),
    });
  }, '已提交登记，等待安全员确认');
  return false;
}

async function doAction(id, action, data, version) {
  await request(`/api/entities/${id}/actions`, {
    method: 'POST',
    headers: headers(),
    body: JSON.stringify({ action, data, expected_version: version }),
  });
}

function confirmChange(id, version) {
  return call(() => doAction(id, 'confirm', {}, version), '已确认，装置可被占用');
}

function rejectChange(id, version) {
  const reason = prompt('退回原因：');
  if (!reason) return;
  return call(() => doAction(id, 'reject', { reason }, version), '已退回申请');
}

function restoreChange(id, version) {
  const restored_by = document.getElementById('rb-' + id).value;
  const restore_note = document.getElementById('rn-' + id).value;
  return call(() => doAction(id, 'restore', { restored_by, restore_note }, version), '已恢复，装置解除占用');
}

function renewChange(id, version) {
  const endValue = document.getElementById('ne-' + id).value;
  if (!endValue) { showMessage('请选择新的结束时间', true); return; }
  const data = {
    work_end: toIso(endValue),
    risk_level: document.getElementById('rl-' + id).value,
    risk_note: document.getElementById('rk-' + id).value,
  };
  return call(() => doAction(id, 'renew', data, version), '已提交续期评估，等待安全员再次确认');
}

function unitName(id) {
  const unit = board.units.find(u => u.id === id);
  return unit ? escapeHtml(unit.data.name || id) : shortId(id);
}

function shortId(id) {
  return String(id).slice(0, 8);
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, ch =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

loadBoard().catch(err => showMessage(err.message, true));
</script>
</body>
</html>
